name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium + WebKit with system deps
        run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - name: Tests (incl. Chromium and WebKit end-to-end)
        run: node --test dist/test/*.test.js
      - name: Memory benchmark (fails above spec targets or >15% over the CI baseline)
        env:
          BENCH_BASELINE: bench/baseline.ci.json
        run: node dist/scripts/bench.js
      - name: Contact sheet of the fixture (artifact)
        if: always()
        run: node dist/cli.js shot "file://$PWD/test/fixture/index.html" --devices breakpoints --framed --out ci-shots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shots
          path: ci-shots/
          if-no-files-found: ignore

  installer:
    # The one-line install, piped exactly like users run it (CI has passwordless sudo, so WebKit libs get installed).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: shellcheck
        run: shellcheck -S warning install.sh
      - name: curl | bash install
        run: cat install.sh | bash -s -- --yes --no-mcp --source "$GITHUB_WORKSPACE"
      - name: Installed command works (Chromium + WebKit)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          bezels devices | head -3
          bezels shot "file://$GITHUB_WORKSPACE/test/fixture/index.html" --device pixel-9 --framed
          bezels shot "file://$GITHUB_WORKSPACE/test/fixture/index.html" --device iphone-16-pro --framed
